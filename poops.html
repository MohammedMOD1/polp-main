<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محمد | Poops Chain</title>
<style>
  :root {
    --primary: #0a84ff;
    --secondary: #5e5ce6;
    --accent: #ff3d57;
    --bg-dark: #0a0a0a;
    --bg-card: #1a1a2e;
    --bg-console: #0d0d1c;
    --text-main: #ffffff;
    --text-muted: #a0a0b0;
    --border-color: rgba(10, 132, 255, 0.3);
  }
  
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
    color: var(--text-main);
    font-family: 'Segoe UI', 'Tajawal', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  #container {
    max-width: 550px;
    margin: 60px auto;
    padding: 40px;
    background: var(--bg-card);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  #container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(10, 132, 255, 0.08) 0%, transparent 70%);
    animation: pulse 8s ease-in-out infinite;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }
  
  #brand {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3em;
    margin-bottom: 30px;
    color: var(--primary);
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
  
  #wrap {
    display: flex;
    flex-direction: column;
    gap: 15px;
    position: relative;
    z-index: 1;
  }
  
  #state {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: glow 3s ease-in-out infinite;
    margin-bottom: 10px;
  }
  
  @keyframes glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }
  
  #out {
    white-space: pre-wrap;
    font: 13px/1.6 'Consolas', 'Monaco', 'Courier New', monospace;
    background: var(--bg-console);
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    max-height: 400px;
    overflow-y: auto;
    opacity: 0.9;
    text-transform: none;
    text-align: right;
    direction: ltr;
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    position: relative;
  }
  
  #out::-webkit-scrollbar {
    width: 8px;
  }
  
  #out::-webkit-scrollbar-track {
    background: rgba(10, 132, 255, 0.1);
    border-radius: 4px;
  }
  
  #out::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 4px;
  }
  
  #out::-webkit-scrollbar-thumb:hover {
    background: var(--secondary);
  }
  
  .ok { 
    color: #00ff88; 
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
  }
  
  .bad { 
    color: #ff3d57; 
    text-decoration: underline;
    text-shadow: 0 0 8px rgba(255, 61, 87, 0.4);
  }
  
  .warn { 
    color: #ffd60a; 
    text-shadow: 0 0 8px rgba(255, 214, 10, 0.4);
  }
  
  .info { 
    color: #0a84ff; 
  }
  
  .success { 
    color: #5e5ce6; 
    font-weight: 600;
  }
  
  .system { 
    color: #ff3d57; 
    font-weight: 700;
  }
  
  #status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    padding: 10px 15px;
    background: rgba(10, 132, 255, 0.05);
    border-radius: 10px;
    border: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-muted);
  }
  
  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: blink 2s ease-in-out infinite;
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  
  .progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(10, 132, 255, 0.2);
    border-radius: 2px;
    margin: 10px 0;
    overflow: hidden;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(10, 132, 255, 0.5);
  }
</style>
</head>
<body>
<div id="container">
  <div id="brand">محمد | Poops Chain</div>
  <div id="wrap">
    <div id="state">جاري تحميل سلسلة Poops...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div id="out"></div>
    <div id="status-bar">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">جاري الاتصال</span>
      </div>
      <span id="version">v2.0 | محمد</span>
    </div>
  </div>
</div>
<script type="module">
  import "./chain_poops.js";
  
  // تحسينات إضافية
  const outEl = document.getElementById('out');
  const progressEl = document.getElementById('progress');
  const statusTextEl = document.getElementById('status-text');
  
  // إضافة تأثيرات عند الكتابة
  const originalWrite = outEl.textContent;
  outEl.textContent = '';
  
  // تحديث شريط التقدم
  function updateProgress(percent) {
    progressEl.style.width = percent + '%';
  }
  
  // تحديث حالة النظام
  function updateStatus(text) {
    statusTextEl.textContent = text;
  }
  
  // تلوين النصوص حسب النوع
  function colorizeOutput(text) {
    return text
      .replace(/(success|complete|done)/gi, '<span class="success">$1</span>')
      .replace(/(error|failed|bad)/gi, '<span class="bad">$1</span>')
      .replace(/(warn|warning)/gi, '<span class="warn">$1</span>')
      .replace(/(info|system)/gi, '<span class="system">$1</span>')
      .replace(/(ok|ready)/gi, '<span class="ok">$1</span>');
  }
  
  // إضافة تأخير بسيط لتحسين الأداء
  setTimeout(() => {
    updateProgress(10);
    updateStatus('جاري التحميل...');
  }, 100);
</script>
</body>
</html>
