<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محمد | Lapse Chain</title>
<style>
  :root {
    --primary: #0a84ff;
    --secondary: #5e5ce6;
    --accent: #ff3d57;
    --success: #00ff88;
    --warning: #ffd60a;
    --bg-dark: #0a0a0a;
    --bg-card: #1a1a2e;
    --bg-console: #0d0d1c;
    --text-main: #ffffff;
    --text-muted: #a0a0b0;
    --border-color: rgba(10, 132, 255, 0.3);
  }
  
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
    color: var(--text-main);
    font-family: 'Segoe UI', 'Tajawal', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  #container {
    max-width: 550px;
    margin: 60px auto;
    padding: 40px;
    background: var(--bg-card);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  #container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(10, 132, 255, 0.08) 0%, transparent 70%);
    animation: pulse 8s ease-in-out infinite;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }
  
  #brand {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3em;
    margin-bottom: 30px;
    color: var(--primary);
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
  
  #wrap {
    display: flex;
    flex-direction: column;
    gap: 15px;
    position: relative;
    z-index: 1;
  }
  
  #state {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: glow 3s ease-in-out infinite;
    margin-bottom: 10px;
  }
  
  @keyframes glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }
  
  #out {
    white-space: pre-wrap;
    font: 13px/1.6 'Consolas', 'Monaco', 'Courier New', monospace;
    background: var(--bg-console);
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    max-height: 400px;
    overflow-y: auto;
    opacity: 0.9;
    text-transform: none;
    text-align: right;
    direction: ltr;
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    position: relative;
    word-break: break-word;
  }
  
  #out::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    opacity: 0.5;
  }
  
  #out::-webkit-scrollbar {
    width: 8px;
  }
  
  #out::-webkit-scrollbar-track {
    background: rgba(10, 132, 255, 0.1);
    border-radius: 4px;
  }
  
  #out::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 4px;
    transition: background 0.3s ease;
  }
  
  #out::-webkit-scrollbar-thumb:hover {
    background: var(--secondary);
  }
  
  .ok { 
    color: var(--success); 
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
    font-weight: 500;
  }
  
  .bad { 
    color: var(--accent); 
    text-decoration: underline;
    text-shadow: 0 0 8px rgba(255, 61, 87, 0.4);
    font-weight: 600;
  }
  
  .warn { 
    color: var(--warning); 
    text-shadow: 0 0 8px rgba(255, 214, 10, 0.4);
    font-weight: 500;
  }
  
  .info { 
    color: var(--primary); 
    font-weight: 500;
  }
  
  .success { 
    color: var(--success); 
    font-weight: 600;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
  }
  
  .error { 
    color: var(--accent); 
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255, 61, 87, 0.3);
  }
  
  .system { 
    color: var(--secondary); 
    font-weight: 600;
  }
  
  .highlight {
    background: rgba(10, 132, 255, 0.2);
    padding: 0 4px;
    border-radius: 3px;
    border-left: 2px solid var(--primary);
  }
  
  #status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    padding: 12px 15px;
    background: rgba(10, 132, 255, 0.05);
    border-radius: 10px;
    border: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: blink 2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--primary);
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  
  .progress-bar {
    width: 100%;
    height: 5px;
    background: rgba(10, 132, 255, 0.2);
    border-radius: 3px;
    margin: 12px 0;
    overflow: hidden;
    position: relative;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
    background-size: 200% 100%;
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(10, 132, 255, 0.6);
    animation: shimmer 2s infinite;
  }
  
  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
    font-size: 11px;
  }
  
  .stat-item {
    padding: 8px;
    background: rgba(10, 132, 255, 0.08);
    border-radius: 6px;
    border-left: 2px solid var(--primary);
  }
  
  .stat-label {
    color: var(--text-muted);
    display: block;
    margin-bottom: 2px;
  }
  
  .stat-value {
    color: var(--primary);
    font-weight: 600;
    font-size: 12px;
  }
  
  #controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    justify-content: center;
  }
  
  .btn {
    padding: 8px 16px;
    background: rgba(10, 132, 255, 0.15);
    border: 1px solid var(--primary);
    color: var(--primary);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .btn:hover {
    background: var(--primary);
    color: var(--bg-dark);
    box-shadow: 0 0 15px rgba(10, 132, 255, 0.5);
  }
  
  .btn:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>
<div id="container">
  <div id="brand">محمد | Lapse Chain</div>
  <div id="wrap">
    <div id="state">جاري تحميل سلسلة Lapse...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div id="out"></div>
    
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">الحالة</span>
        <span class="stat-value" id="stat-status">جاري</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">التقدم</span>
        <span class="stat-value" id="stat-progress">0%</span>
      </div>
    </div>
    
    <div id="status-bar">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">جاري الاتصال</span>
      </div>
      <span id="version">v2.0 | محمد</span>
    </div>
    
    <div id="controls">
      <button class="btn" id="pauseBtn" title="إيقاف مؤقت">⏸ إيقاف</button>
      <button class="btn" id="clearBtn" title="مسح السجل">🗑 مسح</button>
      <button class="btn" id="copyBtn" title="نسخ السجل">📋 نسخ</button>
    </div>
  </div>
</div>

<script type="module">
  import "./chain_lapse.js";
  
  // متغيرات عامة
  const outEl = document.getElementById('out');
  const progressEl = document.getElementById('progress');
  const statusTextEl = document.getElementById('status-text');
  const statStatusEl = document.getElementById('stat-status');
  const statProgressEl = document.getElementById('stat-progress');
  
  let isPaused = false;
  let outputLog = '';
  
  // تحديث شريط التقدم
  window.updateProgress = function(percent) {
    progressEl.style.width = Math.min(percent, 100) + '%';
    statProgressEl.textContent = Math.round(percent) + '%';
  };
  
  // تحديث حالة النظام
  window.updateStatus = function(text) {
    statusTextEl.textContent = text;
  };
  
  // تحديث حالة الإحصائيات
  window.updateStatStatus = function(status) {
    statStatusEl.textContent = status;
    statStatusEl.className = 'stat-value ' + status.toLowerCase();
  };
  
  // إضافة نص إلى السجل
  window.addLog = function(text, type = 'info') {
    if (!isPaused) {
      const className = type ? ` class="${type}"` : '';
      const logEntry = `<span${className}>${text}</span>\n`;
      outEl.textContent += logEntry;
      outputLog += text + '\n';
      outEl.scrollTop = outEl.scrollHeight;
    }
  };
  
  // تلوين النصوص حسب النوع
  window.colorizeOutput = function(text) {
    return text
      .replace(/(success|complete|done|ok)/gi, '<span class="success">$1</span>')
      .replace(/(error|failed|bad|fail)/gi, '<span class="error">$1</span>')
      .replace(/(warn|warning)/gi, '<span class="warn">$1</span>')
      .replace(/(info|system|loading)/gi, '<span class="system">$1</span>')
      .replace(/(\[.*?\])/g, '<span class="highlight">$1</span>');
  };
  
  // أزرار التحكم
  document.getElementById('pauseBtn').addEventListener('click', function() {
    isPaused = !isPaused;
    this.textContent = isPaused ? '▶ استئناف' : '⏸ إيقاف';
    updateStatus(isPaused ? 'موقوف مؤقتًا' : 'جاري التشغيل');
  });
  
  document.getElementById('clearBtn').addEventListener('click', function() {
    if (confirm('هل تريد مسح السجل؟')) {
      outEl.textContent = '';
      outputLog = '';
    }
  });
  
  document.getElementById('copyBtn').addEventListener('click', function() {
    if (outputLog) {
      navigator.clipboard.writeText(outputLog).then(() => {
        const originalText = this.textContent;
        this.textContent = '✓ تم النسخ';
        setTimeout(() => {
          this.textContent = originalText;
        }, 2000);
      });
    }
  });
  
  // تحديثات أولية
  setTimeout(() => {
    updateProgress(10);
    updateStatus('جاري التحميل...');
    updateStatStatus('جاري');
  }, 100);
</script>
</body>
</html>
